<!doctype html>
<html lang="en">
<head>

<title>AED Module Interactions</title>
<style>
:root{
  --bg:#fafaf7; --card:#ffffff; --fg:#1d2127; --muted:#5d6672; --line:#d9dcd5; --hl:#fff4c2;
  --N-bg:#dcebfb; --N-bd:#2a6cb8; --N-fg:#10355e;
  --P-bg:#fde8cf; --P-bd:#c26a10; --P-fg:#5e3205;
  --C-bg:#dcf1df; --C-bd:#2f8a46; --C-fg:#124a22;
  --O-bg:#fbdcdc; --O-bd:#c13b3b; --O-fg:#5e1414;
  --S-bg:#e8e0f5; --S-bd:#7352b8; --S-fg:#2f1b5e;
  --B-bg:#d8f0ee; --B-bd:#1f8a84; --B-fg:#0c4642;
  --X-bg:#ecece8; --X-bd:#8a8f96; --X-fg:#2b2f34;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171a; --card:#1c2024; --fg:#e7e9ec; --muted:#9aa3ae; --line:#2f353b; --hl:#4a4015;
    --N-bg:#173452; --N-bd:#5aa0ec; --N-fg:#cfe5fc;
    --P-bg:#4a2e10; --P-bd:#f0a050; --P-fg:#fde3c4;
    --C-bg:#17381f; --C-bd:#5cc276; --C-fg:#d2f2da;
    --O-bg:#4d1e1e; --O-bd:#ef7878; --O-fg:#fbd5d5;
    --S-bg:#33284f; --S-bd:#a78bec; --S-fg:#e3d9fa;
    --B-bg:#12403d; --B-bd:#4cc6bf; --B-fg:#cdf2ef;
    --X-bg:#262a2f; --X-bd:#7b838c; --X-fg:#dfe2e5;
  }
}
:root[data-theme="dark"]{
  --bg:#14171a; --card:#1c2024; --fg:#e7e9ec; --muted:#9aa3ae; --line:#2f353b; --hl:#4a4015;
  --N-bg:#173452; --N-bd:#5aa0ec; --N-fg:#cfe5fc;
  --P-bg:#4a2e10; --P-bd:#f0a050; --P-fg:#fde3c4;
  --C-bg:#17381f; --C-bd:#5cc276; --C-fg:#d2f2da;
  --O-bg:#4d1e1e; --O-bd:#ef7878; --O-fg:#fbd5d5;
  --S-bg:#33284f; --S-bd:#a78bec; --S-fg:#e3d9fa;
  --B-bg:#12403d; --B-bd:#4cc6bf; --B-fg:#cdf2ef;
  --X-bg:#262a2f; --X-bd:#7b838c; --X-fg:#dfe2e5;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main{max-width:1240px;margin:0 auto;padding:0 16px}
header{padding-top:28px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:20px;margin:28px 0 6px}
h3{font-size:16px;margin:22px 0 6px}
.sub{color:var(--muted);margin:0 0 16px;max-width:80ch}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;border-bottom:1px solid var(--line);padding-bottom:0}
nav button{font:inherit;border:1px solid var(--line);border-bottom:none;background:transparent;color:var(--muted);
  padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);color:var(--fg);font-weight:600;position:relative;top:1px}
section.tab{display:none;padding-bottom:48px}
section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.diagram{overflow-x:auto}
.diagram svg{display:block;min-width:900px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:8px 2px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1.5px solid}
.legend .ar{width:22px;height:0;border:none;border-top:2px solid;border-radius:0;vertical-align:4px}
.legend .ar.d{border-top-style:dashed}
.note{font-size:14px;color:var(--muted);max-width:90ch}
.warn{border-left:4px solid var(--P-bd);background:var(--P-bg);color:var(--P-fg);padding:8px 12px;border-radius:6px;margin:12px 0;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;background:var(--card)}
tr.hl td{background:var(--hl)}
code,.p{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.p{display:inline-block;background:var(--X-bg);color:var(--X-fg);border-radius:4px;padding:0 5px;margin:1px 3px 1px 0;white-space:nowrap}
.pid{font-weight:700;white-space:nowrap}
.pid.Y,.pid.Z{color:var(--B-bd)} .pid.N{color:var(--N-bd)} .pid.P{color:var(--P-bd)} .pid.C{color:var(--C-bd)} .pid.O{color:var(--O-bd)} .pid.S{color:var(--S-bd)}
.tblwrap{overflow-x:auto}
.filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.filter input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-width:260px}
.filter select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.lbl{cursor:default}
.lbl:hover rect{stroke:var(--fg);stroke-width:1}
.theme{margin-left:auto;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}
@media (max-width:600px){h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:12px;align-items:flex-start">
    <div>
      <h1>AED water-column modules: how they interact</h1>
      <p class="sub">Box-and-arrow maps of how <code>libaed-water</code> modules exchange nitrogen, phosphorus and carbon, and which namelist or CSV parameters drive each process. Built from the Fortran in <code>src/</code> on branch <code>dev</code>. Hover an arrow label to highlight its row in the table below.</p>
    </div>
    <button class="theme" id="themeBtn" type="button" aria-label="Toggle light or dark theme">Theme</button>
  </div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>

<script>
/* ===================================================================
   DATA: processes. One source feeds the diagrams' tables and the index.
   id prefix: N nitrogen, P phosphorus, C carbon, O oxygen switches, S sediment
   =================================================================== */
const PROCS = [
// ---------------- PHYTOPLANKTON ----------------
{id:'Y1',name:'Temperature limitation fT',mod:'PHY',flow:'scales growth',params:['fT_Method','theta_growth','T_std','T_opt','T_max'],note:'fT_Method 0 = none; 1 = CAEDYM style. Below T_std it is θ^(T−20), between T_std and T_max a curve peaking near T_opt, and zero above T_max.'},
{id:'Y2',name:'Light limitation fI',mod:'PHY',flow:'scales growth',params:['lightModel','I_K','I_S','KePHY'],note:'lightModel 0 = no photoinhibition (uses I_K), 1 = photoinhibition (uses I_S). Averaged over the layer using PAR and the extinction coefficient. KePHY is the phytoplankton’s own contribution to light extinction.'},
{id:'Y3',name:'Nitrogen limitation fN',mod:'PHY',flow:'NH4⁺, NO3⁻ → limits growth',params:['simDINUptake','simDONUptake','simINDynamics','N_o','K_N','X_ncon','X_nmin','X_nmax','simNFixation'],note:'External: (N−N_o)/(N−N_o+K_N). With simINDynamics=2: from the internal quota IN/C between X_nmin and X_nmax. With N fixation active the N limit is bypassed and replaced by the fixation reduction (Y7).'},
{id:'Y4',name:'Phosphorus limitation fP',mod:'PHY',flow:'FRP → limits growth',params:['simDIPUptake','simIPDynamics','P_0','K_P','X_pcon','X_pmin','X_pmax'],note:'Same structure as Y3 with FRP, P_0 and K_P, or the internal quota IP/C.'},
{id:'Y5',name:'Silica limitation fSi',mod:'PHY',flow:'reactive Si → limits growth',params:['simSiUptake','Si_0','K_Si','X_sicon'],note:'Only for groups with simSiUptake>0 (diatoms). Si uptake follows carbon fixation at X_sicon.'},
{id:'Y6',name:'Gross primary production',mod:'PHY',flow:'DIC → phyto-C, releases O₂',params:['R_growth','p0','p_initial','fT_Method','lightModel','simDINUptake','simDIPUptake','simSiUptake'],note:'R_growth × fT × min(fI, fN, fP, fSi). Nutrient uptake is cut so it never exceeds 99% of the pool in a step. Growth also needs biomass above p0.'},
{id:'Y7',name:'N₂ fixation',mod:'PHY',flow:'N₂ → phyto-N',params:['simNFixation','R_nfix','k_nfix'],note:'Fixation replaces part of the DIN demand and slows growth by up to k_nfix.'},
{id:'Y8',name:'Respiration',mod:'PHY',flow:'phyto-C → DIC, uses O₂',params:['R_resp','theta_resp','k_fres','p0'],note:'Metabolic loss R_resp × θ_resp^(T−20). The k_fres share is true respiration (DIC up, O₂ down). Loss stops when biomass is at or below p0.'},
{id:'Y9',name:'Exudation and excretion → DOM',mod:'PHY',flow:'phyto-C, N, P, Si → DOC, DON, DOP',params:['f_pr','k_fdom','k_fres','c_excretion_target_variable','n_excretion_target_variable','p_excretion_target_variable','si_excretion_target_variable'],note:'Exudation is f_pr of primary production. The metabolic loss not respired is split: k_fdom to DOM, the rest to POM (Y10).'},
{id:'Y10',name:'Mortality → POM',mod:'PHY',flow:'phyto-C, N, P, Si → POC, PON, POP',params:['k_fdom','k_fres','c_mortality_target_variable','n_mortality_target_variable','p_mortality_target_variable','si_mortality_target_variable'],note:'Share (1−k_fdom)(1−k_fres) of the metabolic loss.'},
{id:'Y11',name:'Salinity effect',mod:'PHY',flow:'scales growth or respiration',params:['salTol','S_opt','S_bep','S_maxsp'],note:'|salTol| picks the function (0 none, 1–3 variants). A negative salTol applies it to growth, a positive one to respiration. S_bep is the multiplier at S_maxsp.'},
{id:'Y12',name:'Settling and vertical movement',mod:'PHY',flow:'phyto-C ⇄ depth, → sediment',params:['settling','w_p','d_phy','rho_phy','min_rho','max_rho','phyto_particle_link'],note:'settling: 0 off, 1 constant w_p, 2 temperature-corrected w_p, 3 Stokes (d_phy, rho_phy or a dynamic density state), 4 motile (Ross & Sharples style, driven by internal N and light).'},
{id:'Y13',name:'Resuspension',mod:'PHY',flow:'sediment → phyto-C',params:['resuspension','resus_link','n_zones','active_zones'],note:'Per-group scaling of the resuspension flux, applied to the bottom layer.'},
{id:'Y14',name:'Microphytobenthos',mod:'PHY',flow:'DIC, NH4, NO3, FRP ⇄ benthic algae',params:['do_mpb','R_mpbg','R_mpbr','R_mpbb','I_Kmpb','mpb_max','theta_mpb_growth','theta_mpb_resp'],note:'Benthic algae grow in the bottom layer and take nutrients and DIC directly.'},
{id:'Y15',name:'Output links to other modules',mod:'PHY',flow:'sets which pools receive each flux',params:['c_uptake_target_variable','do_uptake_target_variable','n1_uptake_target_variable','n2_uptake_target_variable','n3_uptake_target_variable','n4_uptake_target_variable','p1_uptake_target_variable','p2_uptake_target_variable','si_uptake_target_variable','dbase','num_phytos','the_phytos'],note:'Leaving a link empty disables that exchange. the_phytos picks the columns of dbase (aed_phyto_pars.csv).'},
// ---------------- ZOOPLANKTON ----------------
{id:'Z1',name:'Grazing',mod:'ZOO',flow:'phyto, POC, other zoo → zoo',params:['Rgrz_zoo','Kgrz_zoo','Cmin_grz_zoo','num_prey','prey(n)%zoop_prey','prey(n)%Pzoo_prey'],note:'Rgrz_zoo × C/(Kgrz_zoo+C) × fT, with C the total prey. Prey are never grazed below Cmin_grz_zoo. The catch is split by the preference factors Pzoo_prey.'},
{id:'Z2',name:'Temperature effect',mod:'ZOO',flow:'scales grazing, respiration, mortality',params:['theta_grz_zoo','Tstd_zoo','Topt_zoo','Tmax_zoo','theta_resp_zoo'],note:'Grazing uses the CAEDYM-style fT (as Y1). Respiration and mortality use θ_grz_zoo^(T−20). theta_resp_zoo is read but not used in the rates.'},
{id:'Z3',name:'Assimilation',mod:'ZOO',flow:'grazed C, N, P → zoo biomass',params:['fassim_zoo','INC_zoo','IPC_zoo'],note:'Fraction fassim_zoo of grazed carbon builds biomass. The animal keeps fixed N:C (INC_zoo) and P:C (IPC_zoo).'},
{id:'Z4',name:'Faeces → POM',mod:'ZOO',flow:'unassimilated food → POC, PON, POP',params:['fassim_zoo','ffecal_zoo','ffecal_sed','pc_target_variable','pn_target_variable','pp_target_variable'],note:'Unassimilated grazing plus ffecal_zoo of respiration. ffecal_sed is the share of pellets assumed to sink straight to the sediment and so is removed from the water-column POM.'},
{id:'Z5',name:'Excretion → DOM',mod:'ZOO',flow:'excess N, P (and C) → DON, DOP, DOC',params:['fexcr_zoo','INC_zoo','IPC_zoo','dc_target_variable','dn_target_variable','dp_target_variable'],note:'Nutrients grazed beyond the animal’s fixed N:C and P:C are excreted as DON and DOP. If one nutrient is short, extra carbon is excreted to restore balance.'},
{id:'Z6',name:'Respiration',mod:'ZOO',flow:'zoo-C lost',params:['Rresp_zoo','theta_grz_zoo','ffecal_zoo','fexcr_zoo','saltfunc_zoo','Smin_zoo','Smax_zoo','Sint_zoo'],note:'Rresp_zoo × fT × fSal. The remainder after faeces and excretion fractions is not routed to DIC or O₂ in this version.'},
{id:'Z7',name:'Mortality',mod:'ZOO',flow:'zoo-C → POM',params:['Rmort_zoo','DOmin_zoo','theta_grz_zoo','min_zoo'],note:'Rmort_zoo × fT × fDO, sent to POC, PON, POP. Below DOmin_zoo the rate rises as 1+(DOmin_zoo−O₂)/DOmin_zoo. Loss stops at min_zoo.'},
{id:'Z8',name:'Salinity effect',mod:'ZOO',flow:'scales respiration',params:['Smin_zoo','Smax_zoo','Sint_zoo','saltfunc_zoo'],note:'A quadratic penalty outside Smin_zoo–Smax_zoo down to the intercept Sint_zoo. saltfunc_zoo is read but the same function is always used.'},
{id:'Z9',name:'Feedback and output links',mod:'ZOO',flow:'switches the return of fluxes',params:['simZoopFeedback','dc_target_variable','dn_target_variable','dp_target_variable','pc_target_variable','pn_target_variable','pp_target_variable','dbase','num_zoops','the_zoops'],note:'With simZoopFeedback off, zooplankton neither remove prey nor return material.'},
// ---------------- NITROGEN ----------------
{id:'N1',name:'DIN uptake',mod:'PHY',flow:'NH4⁺, NO3⁻ → phyto-N',params:['simDINUptake','N_o','K_N','X_ncon','simINDynamics','X_nmin','X_nmax','R_nuptake','R_growth','theta_growth','I_K','n1_uptake_target_variable','n2_uptake_target_variable'],
 note:'Fixed quota (X_ncon) by default; simINDynamics=2 gives a dynamic internal-N pool. NH4/NO3 split follows a preference factor. Uptake is capped at 99% of the available pool each step.'},
{id:'N2',name:'N₂ fixation',mod:'PHY',flow:'N₂ → phyto-N',params:['simNFixation','k_nfix','R_nfix'],note:'Reduces the DIN demand of a group.'},
{id:'N3',name:'Mortality → PON',mod:'PHY',flow:'phyto-N → PON',params:['k_fres','k_fdom','R_resp','theta_resp','n_mortality_target_variable'],note:'Fraction (1−k_fdom)(1−k_fres) of respiration-sized loss goes to the particulate pool.'},
{id:'N4',name:'Excretion/exudation → DON',mod:'PHY',flow:'phyto-N → DON',params:['k_fdom','f_pr','R_resp','n_excretion_target_variable'],note:''},
{id:'N5',name:'Grazing',mod:'ZOO',flow:'phyto-N, PON → zoo-N',params:['Rgrz_zoo','Kgrz_zoo','theta_grz_zoo','Cmin_grz_zoo','num_prey','prey(n)%zoop_prey','prey(n)%Pzoo_prey','fassim_zoo','INC_zoo','simZoopFeedback'],note:'Zooplankton parameters are columns of aed_zoop_pars.csv. Prey is phytoplankton, POC (with its PON) or other zooplankton.'},
{id:'N6',name:'Zoo excretion, faeces, mortality',mod:'ZOO',flow:'zoo-N → DON, PON',params:['fassim_zoo','ffecal_zoo','ffecal_sed','INC_zoo','Rresp_zoo','Rmort_zoo','DOmin_zoo','dn_target_variable','pn_target_variable'],note:'Unassimilated N goes to PON; surplus N is excreted as DON. N- or P-limited animals also excrete excess carbon.'},
{id:'N7',name:'PON hydrolysis',mod:'OGM',flow:'PON → DON',params:['Rpon_hydrol','Kpom_hydrol','theta_hydrol','dom_miner_oxy_reactant_var'],note:'Rate × O₂/(Kpom_hydrol+O₂) × θ^(T−20). Rpom_hydrol is read but never used; set Rpoc/Rpon/Rpop_hydrol individually.'},
{id:'N8',name:'DON mineralisation',mod:'OGM',flow:'DON → NH4⁺',params:['Rdom_minerl','Kdom_minerl','f_an','theta_minerl','dom_miner_oxy_reactant_var'],note:'One shared rate for DOC, DON and DOP. Rdoc/Rdon/Rdop_minerl are stored but not used in the rate calculation.'},
{id:'N9',name:'Nitrification',mod:'NIT',flow:'NH4⁺ → NO3⁻ (uses 2 O₂ per N)',params:['Rnitrif','Knitrif','theta_nitrif','nitrif_reactant_variable','simNitrfpH','nitrif_ph_variable','simNitrfSal','K_sal','S0'],note:'Rnitrif × O₂/(Knitrif+O₂) × θ^(T−20), optional pH and salinity multipliers. Without an O₂ link it runs at a fixed rate.'},
{id:'N10',name:'Denitrification (simple)',mod:'NIT',flow:'NO3⁻ → N₂',params:['Rdenit','Kdenit','theta_denit','oxy_lim','denit_product_variable','simNitrfSal'],note:'Rdenit × Kdenit/(Kdenit+O₂) × NO3/(5+NO3) × θ^(T−20). The 5 mmol/m³ half-saturation is hard-coded. oxy_lim=2 switches to exp(−O₂/Kdenit).'},
{id:'N11',name:'Denitrification (OM-coupled)',mod:'OGM',flow:'NO3⁻ (+ anaerobic DOC) → N₂ / NO2 / N₂O / NH4⁺',params:['simDenitrification','K_nit','Kdom_minerl','Rdom_minerl','f_an','Kin_denitrat','Kin_denitrit','Kin_denitrous','Klim_denitrit','Klim_denitrous','Kpart_denitrit','dom_miner_nit_reactant_var','dom_miner_no2_reactant_var','dom_miner_n2o_reactant_var'],note:'simDenitrification=1 is the simple version (NO3/(K_nit+NO3) of the anaerobic share); 2 is the 3-step NO3→NO2→N₂O→N₂ model. If you enable this, consider Rdenit=0 in aed_nitrogen so NO3 is not removed twice.'},
{id:'N12',name:'Anammox',mod:'NIT',flow:'NH4⁺ + NO2 → N₂',params:['kanammox','Kanmx_nit','Kanmx_amm'],note:'Only when O₂ < ~3.1 mmol/m³ (hard-coded). NO2 is approximated from NO3. Ranammox is deprecated.'},
{id:'N13',name:'DNRA',mod:'NIT',flow:'NO3⁻ → NH4⁺',params:['Rdnra','Kdnra_oxy'],note:'Rdnra × Kdnra_oxy/(Kdnra_oxy+O₂) × NO3.'},
{id:'N14',name:'N₂O cycle (simple)',mod:'NIT',flow:'NO3⁻/NH4⁺ → N₂O → N₂',params:['simN2O','Rn2o','n2o_initial'],note:'simN2O=1: half the denitrification flux leaks as N₂O, nitrification adds an O₂-dependent share (Nevison form), N₂O consumption is Rn2o·N₂O·exp(−O₂/0.3).'},
{id:'N15',name:'NO2/N₂O redox (advanced)',mod:'NIT',flow:'NH4⁺ → NO2 → NO3⁻, N₂O, N₂',params:['simN2O','Rnh4o2','Rno2o2','Rnh4no2','Kpart_ammox','Kin_deamm','no2_initial','Fsed_no2','Ksed_no2'],note:'simN2O=2 runs autotrophic steps here; the heterotrophic steps run in OGM (see N11).'},
{id:'N16',name:'N₂O air–water exchange',mod:'NIT',flow:'N₂O ⇄ atmosphere',params:['simN2O','atm_n2o','n2o_piston_model'],note:'Needs wind, temperature, salinity from the host model.'},
{id:'N17',name:'Atmospheric DIN deposition',mod:'NIT',flow:'atmosphere → NH4⁺, NO3⁻',params:['simDryDeposition','simWetDeposition','atm_din_dd','atm_din_conc','f_dindep_nox'],note:'Wet deposition needs the rain driver. f_dindep_nox is the fraction landing as NO3.'},
{id:'N18',name:'Sediment N release',mod:'NIT',flow:'sediment → NH4⁺, NO3⁻, N₂O',params:['Fsed_amm','Fsed_nit','Fsed_n2o','Ksed_amm','Ksed_nit','Ksed_n2o','theta_sed_amm','theta_sed_nit','Fsed_nit_model','Fsed_amm_variable','Fsed_nit_variable','Fsed_n2o_variable'],note:'See the Sediment tab for the O₂ and temperature scaling.'},
{id:'N19',name:'PON settling, resuspension, DON flux',mod:'OGM',flow:'PON ⇄ sediment, sediment → DON',params:['settling','w_pom','d_pom','rho_pom','Psed_pon_variable','resuspension','resus_link','sedimentOMfrac','Xsn','Fsed_pon_variable','Fsed_don','Fsed_don_variable','Ksed_dom','theta_sed_dom'],note:''},
// ---------------- PHOSPHORUS ----------------
{id:'P1',name:'FRP uptake',mod:'PHY',flow:'FRP → phyto-P',params:['simDIPUptake','P_0','K_P','X_pcon','simIPDynamics','X_pmin','X_pmax','R_puptake','R_growth','theta_growth','p1_uptake_target_variable'],note:'Same structure as N1: fixed quota unless simIPDynamics=2.'},
{id:'P2',name:'Mortality → POP, excretion → DOP',mod:'PHY',flow:'phyto-P → POP, DOP',params:['k_fres','k_fdom','f_pr','R_resp','theta_resp','p_mortality_target_variable','p_excretion_target_variable'],note:''},
{id:'P3',name:'Grazing, excretion, faeces',mod:'ZOO',flow:'phyto-P, POP → zoo-P → DOP, POP',params:['Rgrz_zoo','Kgrz_zoo','fassim_zoo','IPC_zoo','ffecal_zoo','Rresp_zoo','Rmort_zoo','dp_target_variable','pp_target_variable'],note:''},
{id:'P4',name:'POP hydrolysis',mod:'OGM',flow:'POP → DOP',params:['Rpop_hydrol','Kpom_hydrol','theta_hydrol','dom_miner_oxy_reactant_var'],note:''},
{id:'P5',name:'DOP mineralisation',mod:'OGM',flow:'DOP → FRP',params:['Rdom_minerl','Kdom_minerl','f_an','theta_minerl'],note:''},

/* ===================================================================
   DIAGRAM RENDERER
   nodes: {id,x,y,w,h,t:[lines],c:'N|P|C|O|S|B|X',dash}
   edges: {a,b,pts:[[x,y]],l:'N9 Nitrification',tip,c,dash,both,lx,ly,a0:[x,y],b0:[x,y]}
   =================================================================== */
const NS='http://www.w3.org/2000/svg';
function E(tag,attrs,parent,text){
  const n=document.createElementNS(NS,tag);
  for(const k in (attrs||{})) n.setAttribute(k,attrs[k]);
  if(text!==undefined) n.textContent=text;
  if(parent) parent.appendChild(n);
  return n;
}
function edgePoint(n,tx,ty){
  const dx=tx-n.x, dy=ty-n.y;
  if(dx===0&&dy===0) return [n.x,n.y];
  const sx=(n.w/2)/Math.abs(dx||1e-9), sy=(n.h/2)/Math.abs(dy||1e-9);
  const s=Math.min(sx,sy);
  return [n.x+dx*s, n.y+dy*s];
}
function render(hostId,W,H,nodes,edges){
  const host=document.getElementById(hostId);
  const svg=E('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'},host);
  const defs=E('defs',{},svg);
  ['N','P','C','O','S','B','X'].forEach(k=>{
    const m=E('marker',{id:`ah-${hostId}-${k}`,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'},defs);
    E('path',{d:'M0 0L10 5L0 10z',fill:`var(--${k}-bd)`},m);
  });
  const map={}; nodes.forEach(n=>map[n.id]=n);
  const gE=E('g',{},svg), gN=E('g',{},svg), gL=E('g',{},svg);
  nodes.forEach(n=>{
    const g=E('g',{},gN);
    E('rect',{x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx:n.rx||9,
      fill:`var(--${n.c}-bg)`,stroke:`var(--${n.c}-bd)`,'stroke-width':n.thick?2.5:1.5,
      'stroke-dasharray':n.dash?'5 4':'none'},g);
    const lines=n.t, lh=14.5, top=n.y-(lines.length-1)*lh/2+4;
    lines.forEach((s,i)=>E('text',{x:n.x,y:top+i*lh,'text-anchor':'middle',
      'font-size':i===0?13:11,'font-weight':i===0?700:400,fill:`var(--${n.c}-fg)`},g,s));
  });
  edges.forEach(e=>{
    const A=typeof e.a==='string'?map[e.a]:null, B=typeof e.b==='string'?map[e.b]:null;
    const mid=e.pts||[];
    const aTarget = mid.length?mid[0]:(B?[B.x,B.y]:e.b);
    const bTarget = mid.length?mid[mid.length-1]:(A?[A.x,A.y]:e.a);
    let p0 = A?edgePoint(A,aTarget[0],aTarget[1]):e.a;
    let p1 = B?edgePoint(B,bTarget[0],bTarget[1]):e.b;
    if(e.vert && A && B){          // straight vertical run at the target's x
      const s=B.y>A.y?1:-1;
      p0=[B.x,A.y+s*A.h/2]; p1=[B.x,B.y-s*B.h/2];
    }
    const pts=[p0,...mid,p1];
    const col=e.c||'X';
    E('path',{d:'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'),fill:'none',
      stroke:`var(--${col}-bd)`,'stroke-width':e.w||1.8,'stroke-dasharray':e.dash?'6 4':'none',
      'marker-end':`url(#ah-${hostId}-${col})`,'marker-start':e.both?`url(#ah-${hostId}-${col})`:'none'},gE);
    if(!e.l) return;
    // label position: middle of the path by length unless given
    let lx=e.lx, ly=e.ly;
    if(lx===undefined){
      let tot=0; const segs=[];
      for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);segs.push(d);tot+=d;}
      let half=tot/2,i=0; while(i<segs.length-1&&half>segs[i]){half-=segs[i];i++;}
      const f=segs[i]?half/segs[i]:0;
      lx=pts[i][0]+(pts[i+1][0]-pts[i][0])*f; ly=pts[i][1]+(pts[i+1][1]-pts[i][1])*f;
    }
    const g=E('g',{class:'lbl','data-pid':(e.l.match(/^[A-Z]\d+/)||[''])[0]},gL);
    const tw=e.l.length*5.9+10;
    E('rect',{x:lx-tw/2,y:ly-9,width:tw,height:18,rx:5,fill:'var(--bg)','fill-opacity':.94,stroke:`var(--${col}-bd)`,'stroke-width':.8},g);
    E('text',{x:lx,y:ly+4,'text-anchor':'middle','font-size':11,fill:'var(--fg)'},g,e.l);
    if(e.tip) E('title',{},g,e.tip);
  });
  // hover links
  svg.querySelectorAll('.lbl').forEach(g=>{
    const pid=g.getAttribute('data-pid'); if(!pid) return;
    g.addEventListener('mouseenter',()=>document.querySelectorAll(`tr[data-pid="${pid}"]`).forEach(r=>r.classList.add('hl')));
    g.addEventListener('mouseleave',()=>document.querySelectorAll(`tr[data-pid="${pid}"]`).forEach(r=>r.classList.remove('hl')));
  });
}

   Table rendering
   =================================================================== */
function procTable(prefix){
  const rows=PROCS.filter(p=>p.id.startsWith(prefix)&&/^\d+$/.test(p.id.slice(prefix.length)));
  let h='<div class="tblwrap"><table><thead><tr><th>ID</th><th>Process</th><th>Module</th><th>Pools affected</th><th>Controlling parameters</th><th>Notes</th></tr></thead><tbody>';
  rows.forEach(p=>{
    h+=`<tr data-pid="${p.id}"><td class="pid ${prefix}">${p.id}</td><td>${p.name}</td><td>${p.mod.split(/ ?[\/] ?/).map(m=>MODS[m]||m).join(' / ')}</td><td>${p.flow}</td><td>${p.params.map(x=>`<span class="p">${x}</span>`).join('')}</td><td>${p.note}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}
function legend(items){
  return '<div class="legend">'+items.map(i=>i.ar
    ?`<span><i class="ar ${i.d?'d':''}" style="border-top-color:var(--${i.c}-bd)"></i>${i.t}</span>`
    :`<span><i style="background:var(--${i.c}-bg);border-color:var(--${i.c}-bd);${i.d?'border-style:dashed':''}"></i>${i.t}</span>`).join('')+'</div>';
}

/* ---------------- OVERVIEW ---------------- */
sec('overview',`
<h2>Module map</h2>
<p class="note">Each box is an AED module and the pools it owns. Arrows show what moves between them. Pool names are in the modules’ own units: mmol/m³ of C, N, P, Si or O₂. Pale-purple arrows are benthic fluxes; grey are exchanges with the atmosphere.</p>
${legend([{c:'B',t:'Biology (PHY, ZOO)'},{c:'X',t:'Organic matter / forcing'},{c:'N',t:'Nitrogen pool'},{c:'P',t:'Phosphorus pool'},{c:'C',t:'Carbon pool'},{c:'O',t:'Oxygen'},{c:'S',t:'Sediment'},{c:'N',ar:1,t:'N flow'},{c:'P',ar:1,t:'P flow'},{c:'C',ar:1,t:'C flow'},{c:'O',ar:1,t:'O₂ flow'}])}
<div class="card diagram" id="d-overview"></div>
<h3>Reading the map</h3>
<ul class="note">
<li><b>Phytoplankton</b> is the entry point: it takes DIN, FRP, DIC, Si and releases O₂ through the <i>*_uptake_target_variable</i> links in <code>&amp;aed_phytoplankton</code>. Its losses go to organic matter through the <i>*_mortality_/ *_excretion_target_variable</i> links.</li>
<li><b>Organic matter</b> (<code>aed_organic_matter</code>) is the hub. POM hydrolyses to DOM, and DOM mineralises into DIC, NH4 and FRP. Its oxygen-dependent anaerobic share runs denitrification, Fe(III) and SO4 reduction, and methanogenesis (see the Oxic vs anoxic tab).</li>
<li><b>Nitrogen</b> adds the inorganic transformations (nitrification, denitrification, anammox, DNRA, N₂O). <b>Phosphorus</b> adds adsorption to particles and the sediment release. <b>Carbon</b> adds the carbonate system, gas exchange and CH4.</li>
<li><b>Oxygen</b> is both a pool and a switch: nearly every module reads it through a <i>*_reactant_variable</i> or <i>dom_miner_oxy_reactant_var</i> link.</li>
<li>Links are made by variable name in the namelist (for example <code>nitrif_reactant_variable = 'OXY_oxy'</code>). A missing link usually disables that feedback silently.</li>

sec('index',`
<h2>Parameter index</h2>
<p class="note">Every parameter named in the process tables, with the processes it influences. Use the filter to find a parameter, or pick an element to see only its processes. The same name can appear in more than one module.</p>
<div class="filter">
  <input id="q" type="search" placeholder="Filter by parameter, module or process" aria-label="Filter parameters">
  <select id="el" aria-label="Element filter"><option value="">All elements</option><option value="N">Nitrogen</option><option value="P">Phosphorus</option><option value="C">Carbon</option><option value="O">Oxygen switches</option><option value="S">Sediment</option><option value="Y">Phytoplankton</option><option value="Z">Zooplankton</option></select>
  <span class="note" id="cnt"></span>
</div>
<div class="tblwrap card"><table id="idxT"><thead><tr><th>Parameter</th><th>Module</th><th>Influences</th></tr></thead><tbody></tbody></table></div>
`);
(function(){
  const idx={};
  PROCS.forEach(p=>{
    const mods=p.mod.split(/ ?\/ ?/).map(m=>MODS[m]||m).join(' / ');
    p.params.forEach(x=>{
      const key=x+'|'+mods;
      (idx[key]=idx[key]||{p:x,m:mods,list:[]}).list.push(p);
    });
  });
  const rows=Object.values(idx).sort((a,b)=>a.p.toLowerCase().localeCompare(b.p.toLowerCase()));
  const tb=document.querySelector('#idxT tbody');
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.dataset.els=[...new Set(r.list.map(p=>p.id[0]))].join('');
    tr.dataset.s=(r.p+' '+r.m+' '+r.list.map(p=>p.id+' '+p.name).join(' ')).toLowerCase();
    tr.innerHTML=`<td><span class="p">${r.p}</span></td><td>${r.m}</td><td>${r.list.map(p=>`<span class="pid ${p.id[0]}">${p.id}</span> ${p.name}`).join('<br>')}</td>`;
    tb.appendChild(tr);
  });
  const q=document.getElementById('q'), el=document.getElementById('el'), cnt=document.getElementById('cnt');
  function f(){
    const s=q.value.trim().toLowerCase(), e=el.value; let n=0;
    tb.querySelectorAll('tr').forEach(tr=>{
      const ok=(!s||tr.dataset.s.includes(s))&&(!e||tr.dataset.els.includes(e));
      tr.style.display=ok?'':'none'; if(ok)n++;
    });
    cnt.textContent=n+' of '+rows.length+' parameters';
  }
  q.addEventListener('input',f); el.addEventListener('change',f); f();
})();

  const b=document.getElementById('themeBtn'), r=document.documentElement;
  try{const t=localStorage.getItem('aed-theme'); if(t) r.dataset.theme=t;}catch(e){}
  b.addEventListener('click',()=>{
    const dark=(r.dataset.theme==='dark')||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme=dark?'light':'dark';
    try{localStorage.setItem('aed-theme',r.dataset.theme);}catch(e){}
  });
  const h=location.hash.slice(1); if(TABS.some(t=>t.id===h)) show(h);
})();
</script>
</body>
</html>
